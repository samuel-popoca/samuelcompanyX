<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contacto | Samuel Company X</title>

<link rel="stylesheet" href="style.css">
<link rel="icon" href="IMG/logo.png">

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

</head>

<body>

<!-- NAVBAR -->

<header>

<div class="logo">Samuel Company X</div>

<div>
<span class="menu-btn" onclick="openMenu()">☰</span>
<button class="dark-btn" onclick="toggleDark()">🌙</button>
</div>

</header>


<!-- MENU LATERAL -->

<div class="side-menu" id="menu">

<div class="menu-top">
<strong>Samuel Company X</strong>
<span class="close-btn" onclick="closeMenu()">✕</span>
</div>

<a href="index.html">🏠 Inicio</a>
<a href="about.html">👤 Sobre Nosotros</a>
<a href="projects.html">💻 Proyectos</a>
<a href="services.html">⚙️ Servicios</a>
<a href="certificates.html">🏆 Certificados</a>
<a href="contact.html">📞 Contacto</a>

</div>

<div class="overlay" id="overlay" onclick="closeMenu()"></div>


<!-- HERO -->

<section class="hero reveal">

<h1>Contacto</h1>

<div class="blue-line"></div>

<p>
Puede enviarnos un mensaje y le responderemos pronto.
</p>

</section>


<!-- FORMULARIO -->

<div class="container reveal">

<h2>Formulario de contacto</h2>

<input type="text" id="nombre" placeholder="Nombre">

<input type="email" id="correo" placeholder="Correo electrónico">

<textarea id="mensaje" placeholder="Escriba su mensaje"></textarea>

<br><br>

<button onclick="enviarCorreo()">Enviar mensaje</button>

</div>


<footer>
© 2026 Samuel Company X
</footer>


<script>

/* EMAILJS */

(function(){
emailjs.init("YoYcDxpBoC3fh-4jl");
})();


function enviarCorreo(){

let nombre = document.getElementById("nombre");
let correo = document.getElementById("correo");
let mensaje = document.getElementById("mensaje");

emailjs.send("service_9ok9jbs","template_zjq757l",{

nombre: nombre.value,
correo: correo.value,
mensaje: mensaje.value

})
.then(function(){

alert("Mensaje enviado correctamente ✔");

/* LIMPIAR FORMULARIO */

nombre.value = "";
correo.value = "";
mensaje.value = "";

});

}



/* MENU */

const menu = document.getElementById("menu");
const overlay = document.getElementById("overlay");

function openMenu(){

menu.classList.add("open");
overlay.classList.add("show");

}

function closeMenu(){

menu.classList.remove("open");
overlay.classList.remove("show");

}



/* DARK MODE */

if(localStorage.getItem("dark")){
document.body.classList.add("dark");
}

function toggleDark(){

document.body.classList.toggle("dark");

if(document.body.classList.contains("dark")){
localStorage.setItem("dark",true);
}else{
localStorage.removeItem("dark");
}

}



/* ANIMACION SCROLL */

const elements = document.querySelectorAll(".reveal");

const observer = new IntersectionObserver(entries => {

entries.forEach(entry => {

if(entry.isIntersecting){
entry.target.classList.add("show");
}else{
entry.target.classList.remove("show");
}

});

},{threshold:0.2});

elements.forEach(el => observer.observe(el));

</script>


<!-- Al final del body, antes del cierre de </body> -->
<!-- WHATSAPP -->
<a id="whatsapp-btn" target="_blank">
  <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp">
</a>

<script>
  // WhatsApp botón
  const whatsappBtn = document.getElementById("whatsapp-btn");
  let mensaje = "Hola Samuel Company X, vi su página de contacto y me gustaría obtener más información.";
  whatsappBtn.href = "https://wa.me/7621116313?text=" + encodeURIComponent(mensaje);
</script>

<style>
  /* Estilos del botón WhatsApp */
  #whatsapp-btn{
    position:fixed;
    bottom:20px;
    right:20px;
    width:60px;
    height:60px;
    z-index:1000;
  }
  #whatsapp-btn img{
    width:100%;
    height:100%;
  }
</style>

</body>
</html>
